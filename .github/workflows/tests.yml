name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run full test suite
        run: pytest -q
      - name: Verify installed command-line entry point
        run: nexus --help

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --upgrade build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify installed package assets and entry points
        run: |
          python -c "from importlib.resources import files; p=files('nexus').joinpath('ui/index.html'); assert p.is_file(), 'Packaged dashboard HTML is missing'"
          nexus --help
          nexus-gui --help
